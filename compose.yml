services:
  app:
    build: ./backend
    container_name: php_app
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - app_network
  mysql:
    image: mysql:8.0
    container_name: php_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Adicione a senha do root ao .env}
      MYSQL_DATABASE: ${DB_DATABASE:?Adicione o nome do bd ao .env}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - app_network
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    depends_on:
      - mysql
    ports:
      - 8081:80
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      PMA_ARBITRARY: ${PMA_ARBITRARY}
    env_file:
      - .env
    networks:
      - app_network

volumes:
  mysql_data:

networks:
  app_network:
    driver: bridge