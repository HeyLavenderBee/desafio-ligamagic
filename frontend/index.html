<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./index.css" />
  <title>Login</title>
</head>
<body>
  <h1>Faça login como Administrador</h1>
  <p>Para acessar o serviço, é necessário fazer login de uma das contas registradas para administrador.</p>
  <form>
    <p id="error-message"></p>
    <p id="loading-message"></p>
    <label>E-mail</label>
    <input id="email-input">
    <br>
    <label>Senha</label>
    <input id="password-input">
    <button id="login-button" type="button" onclick="checkUser()">Entrar</button>
  </form>
  <script src="index.js"></script>
</body>
</html>
