<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index.css">
    <title>Dashboard</title>
</head>
<body>
    <h2>Cadastrar Carta</h2>
    <label>Nome da carta em inglês</label>
    <input required><br>
    <label>Nome da carta em português</label>
    <input><br>
    <label>Card Game</label>
    <select>
        <option id="magic">Magic: The Gathering</option>
        <option id="pokemon">Pokemon</option>
        <option id="yugioh">Yu-Gi-Oh!</option>
    </select><br>
    <label>Edição</label>
    <select disabled>
        <option>Selecione um Card Game primeiro</option>
    </select><br>
    <label>Imagem da carta</label>
    <input><br>
    <label>Raridade da carta</label>
    <input>
    <br><br>
    <p>Cartas existentes (1)</p>
    <div class="card">
        Nome em inglês da carta<br>
        Nome em português da carta<br>
        Jogo<br>
        Edição<br>
        Raridade<br>
        <img class="card-img" src="img/lucario-card.png">
        <button>Editar carta</button>
    </div>
    <script src="./index.js"></script>
</body>
</html>
